<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc">
<title id="title">Swin-TK architecture: feature and positive-state propagation</title>
<desc id="desc">A convolutional and four-stage Swin encoder supplies five matched-scale skip features. The decoder propagates features and a positive state P through five coarse-to-fine stages. Its final feature predicts 14 segmentation logits, and its final P produces a single-channel uncertainty score. Insets describe encoder attention control and the decoder gain update. Redrawn from report Sections 3.1 through 3.4.</desc>
