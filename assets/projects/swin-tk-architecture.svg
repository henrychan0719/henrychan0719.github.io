<text x="54" y="803" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#3759B8" text-anchor="start">ENCODER BLOCK  /  information control</text>
<rect x="55" y="833" width="259" height="77" rx="9" fill="#FFFFFF" stroke="#B8C8EA" stroke-width="1.5"/>
<text x="184.5" y="868.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17263D" text-anchor="middle">Window attention</text>
<text x="184.5" y="889.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263D" text-anchor="middle">Temperature τ + log-state bias −μℓⱼ</text>
<rect x="362" y="833" width="290" height="77" rx="9" fill="#E8EEFC" stroke="#B8C8EA" stroke-width="1.5"/>
<text x="507.0" y="868.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17263D" text-anchor="middle">Kalman-style gate</text>
<text x="507.0" y="889.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263D" text-anchor="middle">Mix old feature x and branch y</text>
<path d="M 314 871 L 362 871" fill="none" stroke="#3759B8" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<path d="M 507 910 L 507 931 L 184 931 L 184 946" fill="none" stroke="#3759B8" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<rect x="55" y="946" width="259" height="51" rx="9" fill="#FFFFFF" stroke="#B8C8EA" stroke-width="1.5"/>
<text x="184.5" y="977.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17263D" text-anchor="middle">MLP branch</text>
<rect x="362" y="946" width="290" height="51" rx="9" fill="#E8EEFC" stroke="#B8C8EA" stroke-width="1.5"/>
<text x="507.0" y="977.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17263D" text-anchor="middle">Kalman-style gate</text>
<path d="M 314 971 L 362 971" fill="none" stroke="#3759B8" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="55" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17263D">Both residual additions:  x<tspan baseline-shift="sub" font-size="13">new</tspan><tspan> = x + K ⊙ (y − x)</tspan></text>
<text x="55" y="1059" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#728096" text-anchor="start">K = P / (P + R); encoder P is learned per channel.</text>
<text x="55" y="1086" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#728096" text-anchor="start">Log-state ℓ propagates across blocks; it is distinct from decoder P.</text>
<rect x="698" y="769" width="670" height="346" rx="14" fill="#F5FAFA" stroke="#D4E8E5" stroke-width="1.5"/>
<text x="720" y="803" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F81" text-anchor="start">DECODER CELL  /  repeat at all five scales</text>
<text x="720" y="839" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087F81" text-anchor="start">PREDICT</text>
<text x="1063" y="839" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087F81" text-anchor="start">OBSERVE</text>
<text x="720" y="867" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17263D" text-anchor="start">x⁻ = T(x)</text>
<text x="720" y="895" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17263D" text-anchor="start">P⁻ = softplus(Wₚ U(P)) + softplus(q)</text>
<text x="1063" y="867" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17263D" text-anchor="start">z = Wz e</text>
<text x="1063" y="895" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17263D" text-anchor="start">R = softplus(Wᵣ e) + ε</text>
<text x="720" y="920" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#728096" text-anchor="start">T: transposed convolution   ·   U: trilinear upsampling</text>
<rect x="719" y="941" width="628" height="81" rx="9" fill="#E2F2EF" stroke="#B8DBD6" stroke-width="1.5"/>
<text x="737" y="969" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#087F81" text-anchor="start">GAIN</text>
<text x="804" y="969" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#087F81" text-anchor="start">K = P⁻ / (P⁻ + R)</text>
<text x="737" y="1001" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17263D" text-anchor="start">x⁺ = x⁻ + K ⊙ (z − x⁻)</text>
<text x="1080" y="1001" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#087F81" text-anchor="start">P⁺ = (1 − K) ⊙ P⁻</text>
<text x="720" y="1053" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17263D">Refine:  x<tspan baseline-shift="sub" font-size="13">out</tspan><tspan> = φ(Concat(x⁺, mean</tspan><tspan baseline-shift="sub" font-size="13">channel</tspan><tspan>(P⁺)))</tspan></text>
<text x="720" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#728096" text-anchor="start">Pass refined features and P⁺ to the next, finer decoder scale.</text>
<text x="36" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#728096" text-anchor="start">Schematic redrawn from report §§3.1–3.4. Tensor sizes are spatial size × channels for a 96³ patch.</text>
<text x="36" y="1175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#728096" text-anchor="start">P is a learned positive fusion state. Recursion follows network scales, not physical time; σ is evaluated as an error-ranking score.</text>
</svg>