<text x="1213.0" y="439.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#087F81" text-anchor="middle">P → s → σ = exp(s / 2)</text>
<text x="1086" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#728096" text-anchor="start">Single-channel uncertainty score</text>
